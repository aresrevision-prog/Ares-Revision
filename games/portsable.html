<style>
/* Layout: a boss's desk. Survey map of the city on the left, the conversation you are having on the right. */
:root{
  color-scheme:dark;
  --wall:#0f2a25;--wall2:#173a33;--wall3:#24524a;--paper:#dfe6d3;--paper2:#c5d0b9;--ink:#16211d;--mute:#8fa89e;--line:#35635a;--text:#e9efe2;
  --you:#e0a526;--hale:#c2453a;--stroud:#5b8be0;--bad:#ef7f6d;--good:#8fd19e;
  --display:"Limelight","Rockwell",Georgia,serif;--body:"Alegreya Sans","Trebuchet MS",Verdana,sans-serif;--mono:"Courier Prime","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--wall);color:var(--text);font:17px/1.35 var(--body);margin:0;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;max-width:1500px;margin:auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
h1{font:400 30px/1 var(--display);margin:0;color:var(--you);letter-spacing:.02em}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;flex:1;font-variant-numeric:tabular-nums}
.stat{font:700 15px var(--mono);white-space:nowrap}.stat small{display:block;font:500 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.stat.hot b{color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(330px,1fr);gap:12px;min-height:0}
#mapwrap{background:var(--paper);min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--paper2);position:relative}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#panel{background:var(--wall2);border:1px solid var(--line);min-height:0;display:flex;flex-direction:column;min-width:0}
.scroll{overflow-y:auto;padding:14px;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font:400 22px/1.1 var(--display);margin:0;text-wrap:balance}
h3{font:800 12px var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);margin:0}
p{margin:0}
button{font:600 15px/1.2 var(--body);color:var(--text);background:var(--wall3);border:1px solid var(--line);padding:8px 11px;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:#2f6a5f}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--you);outline-offset:1px}
button.main{background:var(--you);color:var(--ink);border-color:var(--you);font-weight:800}button.main:hover:not(:disabled){background:#efbd4e}
button.warn{border-color:var(--bad)}
button.ghost{background:none}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 9px;background:transparent}
.row b{display:block}.row small{color:var(--mute);font-size:13px;display:block}
.tri{display:flex;height:6px;margin-top:4px;background:#0a1d19}.tri i{display:block}
.pf{width:56px;height:56px;display:block;border:1px solid #0a1d19}
.pill{font:700 12px var(--mono);padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:5px}
.note{font-size:15px;color:#cddbd0}
.ledger li{font-size:15px;margin-bottom:4px}.ledger{margin:0;padding-left:18px}
.who{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.who .pf{width:104px;height:104px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) 30px;gap:3px 7px;align-items:center;font:12px var(--mono);margin-top:5px}
.bar{height:7px;background:#0a1d19}.bar i{display:block;height:100%}
.chat{display:flex;flex-direction:column;gap:8px;flex:1}
.say{max-width:88%;padding:7px 10px;font-size:16px;overflow-wrap:anywhere}
.say.n{background:var(--paper);color:var(--ink);align-self:flex-start}
.say.p{background:#3b3414;border:1px solid #6d5d1e;align-self:flex-end}
.say.s{align-self:center;max-width:100%;font:13px var(--mono);color:var(--you);text-align:center;background:none;padding:0 4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font-size:14px;padding:6px 9px}
form{display:flex;gap:6px;width:100%}
input{flex:1;min-width:0;background:#0a1d19;color:var(--text);border:1px solid var(--line);padding:9px;font:15px var(--mono)}
.feed{font:13px/1.4 var(--mono);color:#b9cbbf;display:flex;flex-direction:column;gap:3px}
.you{color:var(--you)}.hale{color:var(--hale)}.stroud{color:var(--stroud)}
.big{font:400 40px/1.05 var(--display);text-wrap:balance}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font:14px var(--mono)}
@media (max-width:860px){
  html,body{height:auto}body{font-size:16px}
  #app{height:auto}main{grid-template-columns:minmax(0,1fr)}
  #mapwrap{height:62vh;width:100%;max-width:100%;overflow:auto;display:block}canvas{width:760px;height:100%;min-width:760px}
  #panel{min-height:70vh}.scroll{overflow:visible}
  h1{font-size:25px}
}

body{background:radial-gradient(ellipse at 40% 30%,#1d4a3f 0,#0f2a25 55%,#081713 100%)}

#panel{background:linear-gradient(#1b4238,#12302a);box-shadow:0 14px 34px rgba(0,0,0,.5);border-color:#3f7468}
button{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.4);transition:transform .08s,background .12s}
button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
button.main{background:linear-gradient(#f0c25a,#c98e16)}
.say{box-shadow:0 2px 5px rgba(0,0,0,.3)}.say.n{border-radius:0 10px 10px 10px}.say.p{border-radius:10px 0 10px 10px}
.pf{box-shadow:0 2px 6px rgba(0,0,0,.5)}.row:hover:not(:disabled) .pf{transform:scale(1.05)}
#banner{position:fixed;left:50%;top:24%;transform:translateX(-50%);font:400 clamp(38px,8vw,84px)/1 var(--display);color:#f3d98a;text-shadow:0 4px 0 #3a2a06,0 0 40px #000;pointer-events:none;z-index:20;opacity:0;white-space:nowrap}
#banner.go{animation:ban 1.3s ease-out}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) scale(1.5)}20%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
[hidden]{display:none!important}
#cine{position:fixed;inset:0;width:100%;height:100%;z-index:50;cursor:pointer;background:#000}
body{background:repeating-linear-gradient(92deg,rgba(0,0,0,.12) 0 3px,transparent 3px 41px),repeating-linear-gradient(90deg,#5b3419 0 220px,#633a1d 220px 480px);}
main{min-height:0}
#mapwrap{border:0;border-image:none;background:transparent;box-shadow:none}
#panel{background:linear-gradient(#25301f,#1a2417);border:6px solid #3a2111;outline:1px solid #000}
.phone{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:#120e0a;padding:8px;border:1px solid #6d5a23}
.ph{width:96px;height:72px;display:block}
.row{background:var(--paper);color:var(--ink)}
.row:hover:not(:disabled){background:#fff7d6!important}
.row small{color:#51604f}.row .num{font:700 12px var(--mono);color:#7a2e24}
.row .pill{background:#16211d;color:#f3d98a}
.online{font:700 12px var(--mono);color:var(--good)}
.pf.large{width:130px;height:130px}
@media (max-width:860px){#mapwrap{height:62vh}canvas#map{width:760px;min-width:760px;height:100%}}
.pf{border:3px solid #e9dfc6;filter:sepia(.6) grayscale(.3) contrast(1.12) brightness(.96);box-shadow:0 3px 7px rgba(0,0,0,.6)}
.row{background:linear-gradient(#ece3c9,#d9cda9);box-shadow:0 2px 4px rgba(0,0,0,.45)}
#panel{background:#171a14;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px;border-color:#2a1608;box-shadow:0 18px 40px rgba(0,0,0,.7)}
.say.n{background:#e8dfc6;font-family:var(--mono);font-size:15px}
.stat{background:linear-gradient(#b6914a,#7c5e24 45%,#a8843f);color:#1d1407;border-color:#3a2a0e;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 5px rgba(0,0,0,.6)}.stat small{color:#33240c}
button{background:linear-gradient(#333026,#1f1d17);border-color:#55503c}
button:hover:not(:disabled){background:linear-gradient(#45412f,#2b2820)}
.phone{background:#0d0b08;border-color:#4a3c18}
#cine{filter:sepia(.22) contrast(1.1)}
.buy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px;border:1px solid #4a3c18;background:#0d0b08}
</style>

function curWant(d){const st=S.n[d].stage,N=D[d].npc;return st===0?N.want:st===1?N.want2:null}

function classify(text){
 const T=S.talk,x=text.toLowerCase();
 if(T.rival){
  if(/truce|peace|deal|ceasefire|agree/.test(x))return'truce';
  if(/drop|quit|withdraw|concede|step down|leave town|get out/.test(x))return canDrop(T.id)?'drop':'droptry';
  if(/know about|secret|expose|leak|your (bank|fund)/.test(x))return S.secrets.includes(T.id)&&!S.used[T.id]?'fold':'taunt';
  if(/rumou?r|gossip|trade|tell me|who/.test(x))return'trade';
  return'taunt';
 }
 const d=T.id;
 if(/or else|regret|hurt|expose|threat|careful|shame|ruin|blackmail|tell everyone|secret of yours|i know what/.test(x))return'threat';
 for(const o of IDS){const w=curWant(o);if(o!==d&&w&&w.from===d&&w.keys&&w.keys.test(x)){S.n[o].known=true;return'item:'+o}}
 const w=curWant(d);
 if(w&&n_known(d)&&w.keys&&w.keys.test(x)&&S.items.includes(w.item))return'deliver';
 if(/here'?s|brought|got you|got your|have it|deliver/.test(x)&&w&&!w.cash&&S.items.includes(w.item))return'deliver';
 const m=x.match(/\$?\b(\d{2,4})\b/);
 if(/\$|money|cash|pay|envelope|bribe|donat|\bfund\b/.test(x)||m){
  if(w&&w.cash&&n_known(d)&&S.cash>=w.cash&&(!m||+m[1]>=w.cash))return'deliver';
  return'bribe:'+(m?m[1]:50);
 }
 if(/i'?ll get|i will get|promise|leave it with me|i'?ll sort|you have my word/.test(x)&&w&&n_known(d)&&!w.cash)return'promise';
 if(/support|endorse|back me|family|side with|with me|join me|work for me/.test(x))return'ask';
 if(/what do you (want|need)|what can i do|need|want|help you|favou?r|problem/.test(x))return'want';
 if(/rumou?r|secret|gossip|heard|who |dirt|talk of|what's going on/.test(x)||IDS.some(o=>D[o].npc.name.toLowerCase().split(' ').some(p=>p.length>3&&x.includes(p))))return'gossip';
 if(/thank|respect|admire|great|love|good work|honou?r|friend|how are|how's|hello|\bhi\b|\bhey\b|beautiful|impress|nice/.test(x))return'charm';
 return'small';
}

 }
